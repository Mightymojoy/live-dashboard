name: sync-feishu

on:
  workflow_dispatch:
  # 改同步脚本/字段映射时自动跑一次：既省掉「改完还要人点一下」的往返，
  # 也让每次改动都能立刻拿到真实结果（含诊断注解）。
  # 只监听这几个路径 —— 同步 bot 自己提交的 live_data.json / sync_meta.json
  # 不在列表里，因此不会形成触发循环。
  push:
    branches: [dist]
    paths:
      - 'tools/feishu_sync.py'
      - 'tools/feishu_field_map.json'
      - '.github/workflows/sync-feishu.yml'
  schedule:
    # 每 2 小时一班（UTC），分钟错到 :07 避开整点高负载区段。
    #
    # 注意这不是「每 2 小时同步一次」。真正的同步由脚本里的 schedule_gate()
    # 决定：只有「北京时间已过 02:00」且「今天还没成功同步过」才执行，
    # 其余班次读到闸门就退出，不写文件、不提交，页面时间戳不变。
    #
    # 为什么不再写死两个时点（原 7 2 / 7 7 = 北京 10:07 / 15:07）：
    # GitHub 的 schedule 实测迟到 7–10 小时且在恶化
    #   11-09 设 10:07 → 实跑 17:39（迟 7h32m）
    #   11-11 设 15:07 → 实跑 23:04（迟 7h57m）
    #   11-09 设 15:07 → 实跑次日 01:23（迟 10h16m）
    # 于是 15:07 那班每次都变成深夜 23 点跑（用户看到的「23 点触发」就是它），
    # 而 10:07 那班落到傍晚。追着延迟改数字是拿变化的量凑固定时刻，必输；
    # 改成「多发班次 + 运行时就地判断」，延迟多少都不影响正确性。
    #
    # 业务前提：最后一班主播在凌晨 2 点前录完，所以 02:00 之后的第一个班次
    # 抓到的才是「昨天完整数据」，早上打开即可用，无需手动点同步。
    #
    # 注意：schedule 事件只读默认分支（main）上的工作流文件，
    # 改这里必须同时更新 dist 与 main，否则等于没改。
    - cron: '7 */2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-feishu
  # 改为 true：同一时刻只该有一次同步。若旧运行卡住（90235 会让单次请求
  # 吃满超时），新代码推上来应当立刻顶替它，而不是排在后面等十几分钟。
  # bot 的同步提交不在 paths 列表里，不会自我触发，因此不会误取消。
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出 dist 分支
        uses: actions/checkout@v4
        with:
          ref: dist
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步飞书数据
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_TOKEN: ${{ secrets.FEISHU_WIKI_TOKEN }}
          SYNC_ACTOR: GitHub Actions
          # 让脚本区分触发来源：只有 schedule 走「02:00 后且今日未同步」的闸门，
          # 手动点击与改脚本触发的运行仍然立即执行（排查时不能被闸门挡住）。
          SYNC_TRIGGER: ${{ github.event_name }}
        run: python tools/feishu_sync.py --sync

      - name: 提交并推送
        # 必须 always()：同步失败时 sync_meta.json / sync_error.json 也要推到 dist，
        # 页面才能直接显示失败原因，不必让人去 Actions 翻日志。
        if: always()
        run: |
          git config user.name "ito-sync-bot"
          git config user.email "ito-sync-bot@users.noreply.github.com"
          git add -A -- live_data.json sync_meta.json 2>/dev/null || true
          git add -A -- sync_error.json 2>/dev/null || true
          git add -A -- sync_probe.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "本次无数据变更，跳过提交"
            exit 0
          fi
          git commit -m "Sync from Feishu: $(date +%F)"
          git push origin HEAD:dist
