name: sync-feishu

on:
  workflow_dispatch:
  schedule:
    # 北京时间 10:07 与 15:07（UTC 02:07 / 07:07）
    #
    # 三条硬约束决定了为什么不是 0 2 * * *（北京 10:00 整）：
    # 1) GitHub cron 一律按 UTC 解释，北京 10:00 必须写 2 时，不是 10 时；
    # 2) 官方文档明确 "High load times include the start of every hour. If the load
    #    is sufficiently high enough, some queued jobs may be dropped" ——
    #    整点边界既有延迟也有被丢弃的风险，因此统一错到 :07；
    # 3) 单点无备份 = 一次被丢当天就断更。实测 11-04：北京 09:17 那次 schedule
    #    被丢弃、13:17 那次延迟到 15:29 才启动，故保留下午一个时点兜底，
    #    两次间隔 5 小时覆盖整个上班时段。
    #
    # 注意：schedule 事件只读默认分支（main）上的工作流文件，
    # 改这里必须同时更新 dist 与 main，否则等于没改。
    - cron: '7 2 * * *'
    - cron: '7 7 * * *'

permissions:
  contents: write

concurrency:
  group: sync-feishu
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出 dist 分支
        uses: actions/checkout@v4
        with:
          ref: dist
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步飞书数据
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_TOKEN: ${{ secrets.FEISHU_WIKI_TOKEN }}
          SYNC_ACTOR: GitHub Actions
        run: python tools/feishu_sync.py --sync

      - name: 提交并推送
        # 必须 always()：同步失败时 sync_meta.json / sync_error.json 也要推到 dist，
        # 页面才能直接显示失败原因，不必让人去 Actions 翻日志。
        if: always()
        run: |
          git config user.name "ito-sync-bot"
          git config user.email "ito-sync-bot@users.noreply.github.com"
          git add -A -- live_data.json sync_meta.json 2>/dev/null || true
          git add -A -- sync_error.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "本次无数据变更，跳过提交"
            exit 0
          fi
          git commit -m "Sync from Feishu: $(date +%F)"
          git push origin HEAD:dist
